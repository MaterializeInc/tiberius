version: "3"
services:
  mssql-primary:
    build:
      context: docker/
      dockerfile: docker-mssql-ag.dockerfile
    hostname: mssql-primary
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "<YourStrong@Passw0rd>"
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "1501:1433"
    volumes:
      - ag-certs:/tmp/ag-certs
    networks:
      - ag-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P '<YourStrong@Passw0rd>' -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mssql-secondary:
    build:
      context: docker/
      dockerfile: docker-mssql-ag.dockerfile
    hostname: mssql-secondary
    environment:
      ACCEPT_EULA: "Y"
      SA_PASSWORD: "<YourStrong@Passw0rd>"
      MSSQL_AGENT_ENABLED: "true"
    ports:
      - "1502:1433"
    volumes:
      - ag-certs:/tmp/ag-certs
    networks:
      - ag-network
    healthcheck:
      test: /opt/mssql-tools18/bin/sqlcmd -S localhost -U SA -P '<YourStrong@Passw0rd>' -C -Q "SELECT 1" || exit 1
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  ag-certs:

networks:
  ag-network:
    driver: bridge
